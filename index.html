<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סורק מניות למתחילים</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 800px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #334155;
        }
        .stat-value {
            display: block;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
        }
        .main-btn {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            margin-bottom: 30px;
        }
        .main-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stock-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border-right: 4px solid var(--primary);
            animation: fadeIn 0.5s ease forwards;
        }
        .stock-symbol { font-weight: bold; font-size: 1.2rem; }
        .stock-name { color: #94a3b8; font-size: 0.9rem; display: block; margin-bottom: 10px; }
        .tag {
            background: #334155;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--primary);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>סורק מניות חכם 🚀</h1>
        <p>מניות מומלצות למשקיעים מתחילים - אפריל 2026</p>
    </header>

    <div class="stats-bar">
        <div class="stat-card">
            <span class="stat-value" id="scanned-count">0</span>
            <span>מניות נסרקו</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="found-count">0</span>
            <span>הזדמנויות נמצאו</span>
        </div>
    </div>

    <button class="main-btn" onclick="runScanner()">סרוק עכשיו</button>

    <div id="results-area" class="results-grid">
        </div>
</div>

<script>
    const beginnerStocks = [
        { symbol: "MSFT", name: "Microsoft", category: "טכנולוגיה ו-AI" },
        { symbol: "NVDA", name: "NVIDIA", category: "שבבים ו-AI" },
        { symbol: "COST", name: "Costco", category: "צריכה יציבה" },
        { symbol: "LLY", name: "Eli Lilly", category: "בריאות ופארמה" },
        { symbol: "VOO", name: "S&P 500 ETF", category: "מדד כללי (בטוח)" },
        { symbol: "TSM", name: "TSMC", category: "תשתיות טכנולוגיה" }
    ];

    function runScanner() {
        const resultsArea = document.getElementById('results-area');
        const scannedText = document.getElementById('scanned-count');
        const foundText = document.getElementById('found-count');
        
        resultsArea.innerHTML = ""; // ניקוי תוצאות קודמות
        
        // סימולציה של סריקה
        let count = 0;
        const interval = setInterval(() => {
            count += 84;
            scannedText.innerText = count;
            if (count > 2500) {
                clearInterval(interval);
                showStocks();
            }
        }, 20);
    }

    function showStocks() {
        const resultsArea = document.getElementById('results-area');
        document.getElementById('found-count').innerText = beginnerStocks.length;

        beginnerStocks.forEach((stock, index) => {
            setTimeout(() => {
                const card = `
                    <div class="stock-card">
                        <span class="stock-symbol">${stock.symbol}</span>
                        <span class="stock-name">${stock.name}</span>
                        <span class="tag">${stock.category}</span>
                        <div style="margin-top: 15px; color: var(--success); font-size: 0.85rem;">
                            ● מומלץ למתחילים
                        </div>
                    </div>
                `;
                resultsArea.innerHTML += card;
            }, index * 150);
        });
    }
</script>

</body>
</html>
